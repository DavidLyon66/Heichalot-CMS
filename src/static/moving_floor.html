<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Moving Floor</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d1214;
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    (function () {
      const canvas = document.getElementById("scene");

      if (!window.THREE) {
        console.error("Three.js did not load.");
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1214);
      scene.fog = new THREE.Fog(0x0d1214, 18, 90);

      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        120
      );

      camera.position.set(0, 2.2, 7);
      camera.lookAt(0, 1.0, -18);

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true
      });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      const gridSize = 200;
      const gridDivisions = 200;

      const grid1 = new THREE.GridHelper(
        gridSize,
        gridDivisions,
        0x56666c,
        0x2b373b
      );

      const grid2 = new THREE.GridHelper(
        gridSize,
        gridDivisions,
        0x56666c,
        0x2b373b
      );

      grid1.position.z = 0;
      grid2.position.z = -gridSize;

      scene.add(grid1);
      scene.add(grid2);

      const clock = new THREE.Clock();
      const walkingSpeed = 1.25;

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
      }

      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.05);
        const movement = walkingSpeed * delta;

        grid1.position.z += movement;
        grid2.position.z += movement;

        if (grid1.position.z >= gridSize) {
          grid1.position.z -= gridSize * 2;
        }

        if (grid2.position.z >= gridSize) {
          grid2.position.z -= gridSize * 2;
        }

        const time = performance.now() * 0.001;

        camera.position.x = Math.sin(time * 0.22) * 0.12;
        camera.position.y = 2.2 + Math.sin(time * 0.45) * 0.025;
        camera.lookAt(0, 1.0, -18);

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", resize);

      resize();
      animate();
    })();
  </script>
</body>
</html>
