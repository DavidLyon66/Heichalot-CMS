      const SAMPLE_WIDTH = 128;
      const SAMPLE_HEIGHT = 128;
      const PARTICLE_COUNT = SAMPLE_WIDTH * SAMPLE_HEIGHT;

      const IMAGE_WORLD_WIDTH = 18;
      const IMAGE_WORLD_HEIGHT = 18;

      const FAR_IMAGE_Z = -144;
      const FINAL_IMAGE_Z = -15;

      const HOLD_SECONDS = 1.8;
      const TRAVEL_SECONDS = 6.2;

      const PARTICLE_STREAM_MULTIPLIER = 2.5;

      const canvas = document.getElementById("scene");
      const status = document.getElementById("status");

      if (!window.THREE) {
        status.textContent = "ERROR: Three.js did not load.";
        console.error("Three.js did not load.");
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080d10);
      scene.fog = new THREE.Fog(0x080d10, 24, 105);

      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        180
      );

      camera.position.set(0, 2.15, 8);
      camera.lookAt(0, 1.0, -22);

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const gridSize = 180;
      const gridDivisions = 180;

      const grid1 = new THREE.GridHelper(
        gridSize,
        gridDivisions,
        0x46616a,
        0x1d3036
      );

      const grid2 = new THREE.GridHelper(
        gridSize,
        gridDivisions,
        0x46616a,
        0x1d3036
      );

      grid1.position.z = 0;
      grid2.position.z = -gridSize;

      scene.add(grid1);
      scene.add(grid2);

      const textureLoader = new THREE.TextureLoader();
      const texture = textureLoader.load(SOURCE_IMAGE);

      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const planeGeometry = new THREE.PlaneGeometry(
        IMAGE_WORLD_WIDTH,
        IMAGE_WORLD_HEIGHT
      );

      const planeMaterial = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 1.0,
        side: THREE.DoubleSide
      });

      const imagePlane = new THREE.Mesh(
        planeGeometry,
        planeMaterial
      );

      imagePlane.position.set(0, 2.0, FAR_IMAGE_Z);
      scene.add(imagePlane);

      const particleGeometry = new THREE.BoxGeometry(
        0.12,
        0.12,
        0.28
      );

      particleGeometry.translate(0, 0, -0.14);

      const particleMaterial = new THREE.MeshBasicMaterial({
        vertexColors: true
      });

      const particles = new THREE.InstancedMesh(
        particleGeometry,
        particleMaterial,
        PARTICLE_COUNT
      );

      particles.instanceMatrix.setUsage(
        THREE.DynamicDrawUsage
      );

      particles.frustumCulled = false;
      scene.add(particles);

      const dummy = new THREE.Object3D();
      const colour = new THREE.Color();

      const startPositions = new Float32Array(
        PARTICLE_COUNT * 3
      );

      const velocities = new Float32Array(
        PARTICLE_COUNT * 3
      );

      const spins = new Float32Array(
        PARTICLE_COUNT * 3
      );

      const phaseOffsets = new Float32Array(
        PARTICLE_COUNT
      );

      let loaded = false;
      let sequenceStart = performance.now() * 0.001;

      function setParticleTransform(
        index,
        x,
        y,
        z,
        scale,
        rx,
        ry,
        rz
      ) {
        dummy.position.set(x, y, z);
        dummy.scale.setScalar(scale);
        dummy.rotation.set(rx, ry, rz);
        dummy.updateMatrix();

        particles.setMatrixAt(index, dummy.matrix);
      }

      function prepareParticles(pixelData) {
        let index = 0;

        for (
          let row = 0;
          row < SAMPLE_HEIGHT;
          row += 1
        ) {
          for (
            let column = 0;
            column < SAMPLE_WIDTH;
            column += 1
          ) {
            const pixelIndex =
              (row * SAMPLE_WIDTH + column) * 4;

            const red =
              pixelData[pixelIndex] / 255;

            const green =
              pixelData[pixelIndex + 1] / 255;

            const blue =
              pixelData[pixelIndex + 2] / 255;

            const x =
              (
                (column + 0.5) / SAMPLE_WIDTH
                - 0.5
              ) * IMAGE_WORLD_WIDTH;

            const y =
              (
                0.5
                - (row + 0.5) / SAMPLE_HEIGHT
              ) * IMAGE_WORLD_HEIGHT
              + 2.0;

            const z = FAR_IMAGE_Z + 0.15;

            startPositions[index * 3] = x;
            startPositions[index * 3 + 1] = y;
            startPositions[index * 3 + 2] = z;

            const radialX =
              x / (IMAGE_WORLD_WIDTH * 0.5);

            const radialY =
              (y - 2.0)
              / (IMAGE_WORLD_HEIGHT * 0.5);

            const randomAngle =
              Math.random() * Math.PI * 2;

            const randomRadius =
              Math.random() * 1.15;

            velocities[index * 3] =
              radialX * (2.0 + Math.random() * 3.6)
              + Math.cos(randomAngle) * randomRadius;

            velocities[index * 3 + 1] =
              radialY * (2.0 + Math.random() * 3.6)
              + Math.sin(randomAngle) * randomRadius;

            velocities[index * 3 + 2] =
              11.5 + Math.random() * 14.0;

            spins[index * 3] =
              (Math.random() - 0.5) * 4.5;

            spins[index * 3 + 1] =
              (Math.random() - 0.5) * 4.5;

            spins[index * 3 + 2] =
              (Math.random() - 0.5) * 4.5;

			phaseOffsets[index] =
			  Math.random() * PARTICLE_STREAM_MULTIPLIER;
  
            particles.setColorAt(
              index,
              colour.setRGB(red, green, blue)
            );

            setParticleTransform(
              index,
              x,
              y,
              z,
              1,
              0,
              0,
              0
            );

            index += 1;
          }
        }

        particles.instanceMatrix.needsUpdate = true;

        if (particles.instanceColor) {
          particles.instanceColor.needsUpdate = true;
        }

        loaded = true;
        sequenceStart = performance.now() * 0.001;
        status.textContent =
          "Image approaching — particles pass through — image remains ahead";
      }

      function sampleSourceImage() {
        const image = new Image();

        image.onload = function () {
          const sampleCanvas =
            document.createElement("canvas");

          sampleCanvas.width = SAMPLE_WIDTH;
          sampleCanvas.height = SAMPLE_HEIGHT;

          const context =
            sampleCanvas.getContext(
              "2d",
              { willReadFrequently: true }
            );

          context.drawImage(
            image,
            0,
            0,
            SAMPLE_WIDTH,
            SAMPLE_HEIGHT
          );

          const imageData =
            context.getImageData(
              0,
              0,
              SAMPLE_WIDTH,
              SAMPLE_HEIGHT
            );

          prepareParticles(imageData.data);
        };

        image.onerror = function () {
          status.textContent =
            "ERROR: embedded source image failed.";
        };

        image.src = SOURCE_IMAGE;
      }

      function smoothStep(value) {
        const t = Math.max(
          0,
          Math.min(1, value)
        );

        return t * t * (3 - 2 * t);
      }

      function animateSequence(nowSeconds) {
        if (!loaded) {
          return;
        }

        const elapsed =
          nowSeconds - sequenceStart;

        const rawProgress =
          (
            elapsed - HOLD_SECONDS
          ) / TRAVEL_SECONDS;

        const progress =
          smoothStep(rawProgress);

        imagePlane.position.z =
          THREE.MathUtils.lerp(
            FAR_IMAGE_Z,
            FINAL_IMAGE_Z,
            progress
          );

        for (
          let index = 0;
          index < PARTICLE_COUNT;
          index += 1
        ) {
          const base = index * 3;

          const x0 =
            startPositions[base];

          const y0 =
            startPositions[base + 1];

          const z0 =
            startPositions[base + 2];

		  const delay =
		    phaseOffsets[index] * 0.18;
  
		  const localProgress =
			  smoothStep(
				(progress - delay)
				/ Math.max(0.001, 1 - delay)
			  );
  
          //const travelTime =
          //  localProgress * TRAVEL_SECONDS;
  		  const travelTime =
		    localProgress
		    * TRAVEL_SECONDS
		    * PARTICLE_STREAM_MULTIPLIER;
  
          const x =
            x0
            + velocities[base] * travelTime;

          const y =
            y0
            + velocities[base + 1] * travelTime;

          const z =
            z0
            + velocities[base + 2] * travelTime;

          const scale =
            THREE.MathUtils.lerp(
              1,
              0.68,
              localProgress
            );

          setParticleTransform(
            index,
            x,
            y,
            z,
            scale,
            spins[base] * travelTime,
            spins[base + 1] * travelTime,
            spins[base + 2] * travelTime
          );
        }

        particles.instanceMatrix.needsUpdate = true;

        if (progress >= 1) {
          particles.visible = false;
          status.textContent =
            "Location image now visible ahead — click to replay";
        } else {
          particles.visible = true;
        }
      }

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta =
          Math.min(clock.getDelta(), 0.05);

        const movement =
          0.55 * delta;

        grid1.position.z += movement;
        grid2.position.z += movement;

        if (grid1.position.z >= gridSize) {
          grid1.position.z -= gridSize * 2;
        }

        if (grid2.position.z >= gridSize) {
          grid2.position.z -= gridSize * 2;
        }

        const nowSeconds =
          performance.now() * 0.001;

        camera.position.x =
          Math.sin(nowSeconds * 0.17) * 0.08;

        camera.position.y =
          2.15
          + Math.sin(nowSeconds * 0.31)
          * 0.018;

        camera.lookAt(0, 1.0, -22);

        animateSequence(nowSeconds);
        renderer.render(scene, camera);
      }

      function restartSequence() {
        sequenceStart =
          performance.now() * 0.001;

        imagePlane.position.z =
          FAR_IMAGE_Z;

        particles.visible = true;

        status.textContent =
          "Replaying image approach…";
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
      }

      window.addEventListener(
        "resize",
        resize
      );

      window.addEventListener(
        "click",
        restartSequence
      );

      resize();
      sampleSourceImage();
      animate();
    })();
