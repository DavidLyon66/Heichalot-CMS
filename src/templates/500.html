{% extends "base.html" %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center px-6 py-12">

  <div class="card w-full max-w-xl bg-base-200 shadow-xl">
    <div class="card-body items-center text-center">

      <div class="text-error mb-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-16 w-16"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M12 9v4m0 4h.01M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z"
          />
        </svg>
      </div>

      <h1 class="card-title text-2xl">
        We cannot process your request at the moment.
      </h1>

      <p class="mt-2 text-base-content/70">
        Please try again later.
      </p>

      <div class="card-actions mt-6">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
          Return to CMS
        </a>

        <button
          type="button"
          class="btn btn-ghost"
          onclick="window.history.back()"
        >
          Go back
        </button>
      </div>

    </div>
  </div>

</div>
{% endblock %}
